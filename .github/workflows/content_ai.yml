name: Monday AI Content Factory

on:
  schedule:
    - cron: '*/5 * * * *'    # Poll every 5 minutes for status changes
    - cron: '0 13 * * 1'     # Weekly recommendation every Monday 9AM EST
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'poll'
        type: choice
        options:
          - poll
          - recommend

jobs:
  # POLLING JOB: Scans Monday.com board and reacts to status changes
  poll-and-react:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'poll' ||
      github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Poll Monday.com for pending actions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          MASTER_BOARD_ID: ${{ secrets.MASTER_BOARD_ID }}
        run: python ai_engine.py poll

  # WEEKLY RECOMMENDATION: AI suggests what to post next
  weekly-recommend:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'recommend' ||
      github.event.schedule == '0 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate AI Strategy Recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          MASTER_BOARD_ID: ${{ secrets.MASTER_BOARD_ID }}
        run: python ai_engine.py recommend
