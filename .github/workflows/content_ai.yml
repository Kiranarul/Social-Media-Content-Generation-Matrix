name: Monday AI Content Factory

on:
  schedule:
    - cron: '*/5 * * * *'    # Poll every 5 minutes (small delays/queuing is fine)
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      mode:
        description: 'What to run: poll or recommend'
        required: true
        default: 'poll'
        type: choice
        options:
          - poll
          - recommend

jobs:
  # -----------------------------------------------------------------
  # POLL JOB — runs every 5 min via cron OR when manually dispatched
  # as 'poll'. Scans Monday.com and reacts to status changes.
  # NOTE: no 'if' guard on schedule — GitHub cron is unreliable when
  # multiple schedules share a single workflow. Single schedule = works.
  # -----------------------------------------------------------------
  poll-and-react:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggressive poll loop — runs every 30s for 9 minutes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          MASTER_BOARD_ID: ${{ secrets.MASTER_BOARD_ID }}
        run: |
          END=$((SECONDS + 540))   # 9 minutes = 540 seconds (leaves 60s buffer before timeout-minutes: 10)
          ITERATION=0
          while [ $SECONDS -lt $END ]; do
            ITERATION=$((ITERATION + 1))
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Poll iteration #$ITERATION | $(date '+%H:%M:%S') | ${SECONDS}s elapsed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            python ai_engine.py poll || echo "⚠️  Poll returned non-zero exit — continuing loop"
            REMAINING=$((END - SECONDS))
            if [ $REMAINING -gt 30 ]; then
              echo "💤 Sleeping 30s... ($REMAINING s remaining in window)"
              sleep 30
            else
              echo "⏱️  Window closing in ${REMAINING}s — exiting loop"
              break
            fi
          done
          echo "✅ Poll loop complete after $ITERATION iteration(s)"

  # -----------------------------------------------------------------
  # RECOMMEND JOB — only runs when manually dispatched as 'recommend'.
  # AI generates the next content suggestion and posts it to Monday
  # with status = Done (human must flip to Ready to Generate).
  # Run this manually once a day/week from GitHub Actions → Run workflow.
  # -----------------------------------------------------------------
  daily-recommend:
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'recommend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI Strategy Recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          MASTER_BOARD_ID: ${{ secrets.MASTER_BOARD_ID }}
        run: python ai_engine.py recommend
